    <style>
      /* Estilos adicionales específicos para Copa de la Reina */
      :root {
        --copa-purple: #8e44ad;
        --copa-purple-light: #9b59b6;
        --copa-purple-dark: #6c3483;
        --copa-gold: #ffd700;
        --copa-silver: #c0c0c0;
      }

      body {
        background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
      }

      /* Efecto de estrellas en el fondo */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            2px 2px at 20px 30px,
            var(--copa-purple-light),
            transparent
          ),
          radial-gradient(3px 3px at 40px 70px, var(--copa-gold), transparent),
          radial-gradient(2px 2px at 60px 20px, var(--white), transparent),
          radial-gradient(
            3px 3px at 80px 50px,
            var(--copa-purple),
            transparent
          ),
          radial-gradient(2px 2px at 90px 80px, var(--copa-silver), transparent);
        background-size: 200px 200px;
        z-index: -1;
        opacity: 0.3;
        animation: twinkle 4s infinite alternate;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
